<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5b52"/>
      <stop offset="1" stop-color="#df3b32"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e8ee"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#bfe4ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7fb4e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3d6ea5" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <!-- background (iOS rounds the corners itself) -->
  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- Poke Ball -->
  <g transform="translate(84 96)">
    <circle r="58" fill="url(#white)" stroke="#12151f" stroke-width="6"/>
    <path d="M-58 0a58 58 0 0 1 116 0Z" fill="url(#red)"/>
    <rect x="-58" y="-5.5" width="116" height="11" fill="#12151f"/>
    <circle r="19" fill="#f4f6fb" stroke="#12151f" stroke-width="6"/>
    <circle r="8.5" fill="#ffffff" stroke="#12151f" stroke-width="4"/>
    <!-- subtle top sheen -->
    <ellipse cx="-22" cy="-30" rx="18" ry="10" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- Detective / spy hat, tilted top-left -->
  <g transform="translate(60 40) rotate(-16)">
    <ellipse cx="0" cy="14" rx="40" ry="9" fill="#20242e"/>
    <path d="M-24 14c0-20 4-30 24-30s24 10 24 30Z" fill="#2b3040"/>
    <rect x="-24" y="9" width="48" height="7" rx="3.5" fill="#161a24"/>
  </g>

  <!-- Magnifying glass, lower-right -->
  <g transform="translate(128 132) rotate(20)">
    <line x1="8" y1="8" x2="34" y2="34" stroke="#12151f" stroke-width="13" stroke-linecap="round"/>
    <line x1="8" y1="8" x2="34" y2="34" stroke="#c9a24a" stroke-width="7" stroke-linecap="round"/>
    <circle r="24" fill="url(#lens)" stroke="#12151f" stroke-width="10"/>
    <circle r="24" fill="none" stroke="#e6c766" stroke-width="4.5"/>
    <path d="M-12 -6a18 18 0 0 1 12 -11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
